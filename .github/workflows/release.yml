name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read project metadata
        id: project
        run: |
          $project = Get-ChildItem -Recurse *.csproj | Select-Object -First 1

          [xml]$xml = Get-Content $project.FullName

          $name = $xml.Project.PropertyGroup.AssemblyName
          $version = $xml.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($name)) {
            $name = $project.BaseName
          }

          echo "name=$name" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "project=$($project.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.project }}"

      - name: Publish
        run: |
          dotnet publish "${{ steps.project.outputs.project }}" -c Release -o publish

      - name: Create versioned EXE
        run: |
          $exe = Get-ChildItem publish\*.exe | Select-Object -First 1

          Copy-Item `
            $exe.FullName `
            "${{ steps.project.outputs.name }}-${{ steps.project.outputs.version }}-win-x64.exe"

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath "${{ steps.project.outputs.name }}-${{ steps.project.outputs.version }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.project.outputs.version }}
          name: ${{ steps.project.outputs.version }}
          files: |
            ${{ steps.project.outputs.name }}-${{ steps.project.outputs.version }}-win-x64.exe
            ${{ steps.project.outputs.name }}-${{ steps.project.outputs.version }}-win-x64.zip